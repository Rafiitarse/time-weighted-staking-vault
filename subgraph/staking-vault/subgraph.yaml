specVersion: 1.3.0
description: >-
  Subgraph for the StakingVault contract — tracks ETH deposit lots,
  age-based reward withdrawals, and protocol-wide staking statistics.
repository: https://github.com/your-org/staking-vault-subgraph
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: StakingVault
    network: sepolia
    source:
      address: "0x4EbF2EE5753F729F1D8C166BA36783eD35ab48Bf"
      abi: StakingVault
      
      startBlock: 11674936
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - DepositLot
        - LotWithdrawal
        - ProtocolStat
      abis:
        - name: StakingVault
          file: ./abis/StakingVault.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,uint256,uint256,uint256)
          handler: handleWithdrawn
        - event: TokensSet(indexed address,indexed address)
          handler: handleTokensSet
      file: ./src/staking-vault.ts
