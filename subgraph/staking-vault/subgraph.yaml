specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: StakingVault
    network: sepolia
    source:
      address: "0x4EbF2EE5753F729F1D8C166BA36783eD35ab48Bf"
      abi: StakingVault
      startBlock: 11674936
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Deposited
        - OwnershipTransferred
        - Paused
        - TokensSet
        - Unpaused
        - Withdrawn
      abis:
        - name: StakingVault
          file: ./abis/StakingVault.json
      eventHandlers:
        - event: Deposited(indexed address,uint256,uint256,uint256)
          handler: handleDeposited
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Paused(address)
          handler: handlePaused
        - event: TokensSet(indexed address,indexed address)
          handler: handleTokensSet
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: Withdrawn(indexed address,uint256,uint256,uint256)
          handler: handleWithdrawn
      file: ./src/staking-vault.ts
